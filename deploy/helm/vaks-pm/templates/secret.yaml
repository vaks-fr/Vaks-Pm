{{- if not .Values.secrets.existingSecret }}
{{- /*
  Chart-managed Secret. For production prefer secrets.existingSecret so plaintext
  never lands in values / Helm release history. When existingSecret is set this
  whole template is skipped and the referenced Secret must carry the same keys.

  IMPORTANT: each generated-password helper re-rolls its random on every call,
  so compute them ONCE into $vars and reuse — DATABASE_URL must carry the same
  password we store as POSTGRES_PASSWORD.
*/ -}}
{{- $pgPass := include "vakspm.postgresPassword" . -}}
{{- $minioPass := include "vakspm.minioPassword" . -}}
{{- $redisPass := include "vakspm.redisPassword" . -}}
{{- $dbUrl := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $dbUrl = printf "postgresql://%s:%s@%s:5432/%s?schema=public" .Values.postgresql.auth.username $pgPass (include "vakspm.postgresql.fullname" .) .Values.postgresql.auth.database -}}
{{- else -}}
{{- $dbUrl = include "vakspm.databaseUrl" . -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vakspm.fullname" . }}-secret
  labels:
    {{- include "vakspm.labels" . | nindent 4 }}
  annotations:
    # Keep generated passwords stable across upgrades (helpers read them back).
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  DATABASE_URL: {{ $dbUrl | quote }}
  REDIS_URL: {{ include "vakspm.redisUrl" (dict "root" . "password" $redisPass) | quote }}
  {{- if and .Values.redis.enabled .Values.redis.auth.enabled }}
  # Read by the in-cluster Redis (--requirepass) and stored so the helper reads
  # it back on upgrade (stable REDIS_URL).
  REDIS_PASSWORD: {{ $redisPass | quote }}
  {{- end }}
  JWT_ACCESS_SECRET: {{ required "secrets.jwtAccessSecret is required (or use existingSecret)" .Values.secrets.jwtAccessSecret | quote }}
  JWT_REFRESH_SECRET: {{ required "secrets.jwtRefreshSecret is required (or use existingSecret)" .Values.secrets.jwtRefreshSecret | quote }}
  MFA_ENCRYPTION_KEY: {{ required "secrets.mfaEncryptionKey is required (or use existingSecret)" .Values.secrets.mfaEncryptionKey | quote }}
  WORKER_API_TOKEN: {{ required "secrets.workerApiToken is required (or use existingSecret)" .Values.secrets.workerApiToken | quote }}
  {{- if .Values.minio.enabled }}
  S3_SECRET_KEY: {{ $minioPass | quote }}
  {{- else }}
  S3_SECRET_KEY: {{ .Values.s3.external.secretKey | quote }}
  {{- end }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  SSO_OIDC_CLIENT_SECRET: {{ .Values.secrets.ssoOidcClientSecret | quote }}
  {{- with .Values.secrets.syslogClientKey }}
  syslog_client_key: {{ . | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  # Stored so the password helper reads it back on upgrade (stable DATABASE_URL).
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  {{- end }}
{{- end }}
