{{- if and (not .Values.crypto.existingSecret) .Values.crypto.keks }}
{{- /*
  DORA envelope-encryption keyring. Holds versioned KEKs (kek_v<N>) used to wrap
  per-tenant DEKs. Mounted read-only into api/worker/controlplane at
  crypto.keysDir. For production prefer crypto.existingSecret (managed/rotated
  out-of-band) so key material never lands in values / Helm release history.

  Keys MUST be named kek_v<N> and be base64-encoded 32-byte keys; the app
  ignores any other file in the directory. MFA_ENCRYPTION_KEY remains the `env`
  ref and is always usable to decrypt legacy blobs.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vakspm.fullname" . }}-keyring
  labels:
    {{- include "vakspm.labels" . | nindent 4 }}
  annotations:
    # Keep the keyring across upgrades/uninstall — losing a KEK that wrapped live
    # DEKs makes those secrets unrecoverable.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{- range $k, $v := .Values.crypto.keks }}
  {{- if not (regexMatch "^kek_v[0-9]+$" $k) }}
  {{- fail (printf "crypto.keks: key %q must be named kek_v<N> (e.g. kek_v1)" $k) }}
  {{- end }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
