apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vakspm.fullname" . }}-api
  labels:
    {{- include "vakspm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "vakspm.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when config/secret change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Rolls the pod when Redis auth / secret inputs change (e.g. enabling
        # redis.auth on upgrade rewrites REDIS_URL in the Secret: pods must
        # restart to read it, or they keep the password-less URL → NOAUTH).
        checksum/secret-inputs: {{ include "vakspm.secretInputsChecksum" . }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "vakspm.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vakspm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "vakspm.image" (dict "root" . "repo" .Values.image.api.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "vakspm.fullname" . }}-config
            - secretRef:
                name: {{ include "vakspm.secretName" . }}
          env:
            {{- if eq .Values.tenancy.mode "pooled" }}
            - name: SERVICE_ROLE
              value: data-plane
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- include "vakspm.cryptoProviderEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- $cryptoOn := eq (include "vakspm.cryptoKeyringEnabled" .) "true" }}
          {{- $pgCaOn := eq (include "vakspm.pgCaEnabled" .) "true" }}
          {{- if or $cryptoOn $pgCaOn }}
          volumeMounts:
            {{- if $cryptoOn }}
            - name: crypto-keyring
              mountPath: {{ .Values.crypto.keysDir }}
              readOnly: true
            {{- end }}
            {{- if $pgCaOn }}
            - name: pg-ca
              mountPath: /etc/vaks/pg-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $cryptoOn $pgCaOn }}
      volumes:
        {{- if $cryptoOn }}
        - name: crypto-keyring
          secret:
            secretName: {{ include "vakspm.cryptoSecretName" . }}
        {{- end }}
        {{- if $pgCaOn }}
        - name: pg-ca
          secret:
            secretName: {{ .Values.tls.postgresCaSecret }}
        {{- end }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vakspm.fullname" . }}-api
  labels:
    {{- include "vakspm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "vakspm.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
