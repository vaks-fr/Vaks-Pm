apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vakspm.fullname" . }}-config
  labels:
    {{- include "vakspm.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  API_PORT: {{ .Values.api.port | quote }}
  PUBLIC_BASE_URL: {{ required "publicBaseUrl is required" .Values.publicBaseUrl | quote }}
  APP_URL: {{ .Values.publicBaseUrl | quote }}
  CORS_ORIGIN: {{ default .Values.publicBaseUrl .Values.corsOrigin | quote }}
  # --- Tenancy ---
  DEPLOYMENT_MODE: {{ .Values.tenancy.mode | quote }}
  {{- if eq .Values.tenancy.mode "pooled" }}
  TENANCY_BASE_DOMAIN: {{ required "tenancy.baseDomain is required in pooled mode" .Values.tenancy.baseDomain | quote }}
  {{- end }}
  # --- JWT TTLs ---
  JWT_ACCESS_TTL: {{ .Values.jwt.accessTtl | quote }}
  JWT_REFRESH_TTL: {{ .Values.jwt.refreshTtl | quote }}
  # --- Crypto keyring (DORA KEK rotation) ---
  CRYPTO_KEYS_DIR: {{ .Values.crypto.keysDir | quote }}
  {{- with .Values.crypto.activeKek }}
  CRYPTO_ACTIVE_KEK: {{ . | quote }}
  {{- end }}
  # --- External KEK provider (DORA — KMS/HSM custody, non-secret vars) ---
  # CRYPTO_KEY_PROVIDER selects the ACTIVE provider (used for new wraps). Each
  # provider's settings are emitted whenever that provider is CONFIGURED (kms.keyId
  # / hsm.brokerUrl), independent of which is active — so during a migration the
  # source provider stays available to UNWRAP existing DEKs (registry routes by
  # the kekRef scheme). Configure both kms and hsm to migrate between them.
  {{- $cryptoProvider := include "vakspm.cryptoProvider" . }}
  {{- if ne $cryptoProvider "local" }}
  CRYPTO_KEY_PROVIDER: {{ $cryptoProvider | quote }}
  {{- end }}
  {{- if .Values.crypto.kms.keyId }}
  CRYPTO_KMS_KEY_ID: {{ .Values.crypto.kms.keyId | quote }}
  {{- with .Values.crypto.kms.region }}
  CRYPTO_KMS_REGION: {{ . | quote }}
  {{- end }}
  {{- with .Values.crypto.kms.endpoint }}
  CRYPTO_KMS_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.crypto.hsm.brokerUrl }}
  CRYPTO_HSM_BROKER_URL: {{ .Values.crypto.hsm.brokerUrl | quote }}
  {{- with .Values.crypto.hsm.keyLabel }}
  CRYPTO_HSM_KEY_LABEL: {{ . | quote }}
  {{- end }}
  {{- end }}
  # --- In-transit TLS to backing services ---
  {{- if .Values.tls.postgres }}
  PG_TLS: "1"
  {{- if .Values.tls.postgresCaSecret }}
  PG_TLS_CA: /etc/vaks/pg-ca/ca.crt
  PG_TLS_MODE: {{ .Values.tls.postgresVerifyMode | quote }}
  {{- end }}
  {{- end }}
  # --- Object storage (non-sensitive) ---
  {{- if .Values.minio.enabled }}
  S3_ENDPOINT: {{ printf "http://%s:9000" (include "vakspm.minio.fullname" .) | quote }}
  S3_PORT: "9000"
  S3_USE_SSL: "false"
  S3_FORCE_PATH_STYLE: "true"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY: {{ .Values.minio.rootUser | quote }}
  S3_BUCKET_PREFIX: {{ .Values.minio.bucketPrefix | quote }}
  S3_CREATE_BUCKETS: "true"
  {{- else }}
  S3_ENDPOINT: {{ .Values.s3.external.endpoint | quote }}
  S3_PORT: {{ .Values.s3.external.port | quote }}
  S3_USE_SSL: {{ .Values.s3.external.useSSL | quote }}
  {{- if not (kindIs "invalid" .Values.s3.external.forcePathStyle) }}
  S3_FORCE_PATH_STYLE: {{ .Values.s3.external.forcePathStyle | quote }}
  {{- end }}
  S3_REGION: {{ .Values.s3.external.region | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.external.accessKey | quote }}
  S3_BUCKET_PREFIX: {{ .Values.s3.external.bucketPrefix | quote }}
  S3_CREATE_BUCKETS: {{ .Values.s3.external.createBuckets | quote }}
  {{- end }}
  # --- Rate limits (only when explicitly set) ---
  {{- with .Values.rateLimits.ipLimit }}
  RL_IP_LIMIT: {{ . | quote }}
  {{- end }}
  {{- with .Values.rateLimits.patLimit }}
  RL_PAT_LIMIT: {{ . | quote }}
  {{- end }}
  {{- with .Values.rateLimits.orgLimit }}
  RL_ORG_LIMIT: {{ . | quote }}
  {{- end }}
  {{- with .Values.rateLimits.windowMs }}
  RL_WINDOW_MS: {{ . | quote }}
  {{- end }}
