# Prod — Docker Swarm (tier applicatif uniquement).
# PostgreSQL/Patroni/etcd/HAProxy tournent NATIVEMENT sur les hôtes (hors Swarm),
# voir infra/ et SPECIFICATION.md §12.3. L'API joint la base via HAProxy.
#
# Déploiement :  docker stack deploy -c docker-stack.yml vaks-pm
# Pré-requis   :  images vaks-pm/{web,api,worker}:latest construites/poussées,
#                 secrets Swarm créés (voir infra/bootstrap/50-deploy.sh).

version: "3.9"

networks:
  vakspm:
    driver: overlay
    attachable: true
  # Réseau DÉDIÉ au serveur MCP (pièce exposée à Internet) : il n'y joint que
  # l'API et Traefik. Le MCP n'est PAS sur `vakspm` → une RCE dans le conteneur
  # mcp ne voit ni Redis (clés `oauth:refresh:*` = forge d'un PAT admin), ni
  # Garage, ni le worker. Non attachable : aucun conteneur ad hoc n'y entre.
  mcp-api:
    driver: overlay

volumes:
  redisdata:
  garagedata:

secrets:
  jwt_access_secret:
    external: true
  # Mot de passe Redis (`requirepass`). HEX uniquement (inséré dans REDIS_URL).
  # Créer une fois : `openssl rand -hex 32 | docker secret create redis_password -`
  # (fait par infra/bootstrap/50-deploy.sh). ⚠️ Exige des images api/worker qui
  # contiennent `src/redis-env.ts` (≥ 2026-09-29) : avec une image plus ancienne
  # (VAKS_TAG épinglé), tous les clients Redis tomberaient en NOAUTH.
  # Lu par redis (--requirepass) et par api/controlplane/worker via
  # REDIS_PASSWORD_FILE (cf. api/src/redis-env.ts) — jamais en variable d'env.
  redis_password:
    external: true
  jwt_refresh_secret:
    external: true
  database_url:
    external: true
  # Clé maître AES-256 pour le chiffrement at-rest des secrets TOTP.
  # Créer une fois sur host1 : `openssl rand -base64 32 | docker secret create mfa_encryption_key -`
  mfa_encryption_key:
    external: true
  # Mot de passe SMTP (ou app password Microsoft 365) — utilisé uniquement quand
  # `smtp.authMode = password` dans l'admin. Créer sur host1 :
  #   printf '<password>' | docker secret create smtp_password -
  # Pour rotation : `docker secret rm smtp_password && docker secret create ...`
  # puis `docker service update --force vaks-pm_worker`.
  smtp_password:
    external: true
  # Secret client OIDC (SSO — phase 10). Monté sur `api` ET `controlplane` :
  #   - controlplane sert le flow OIDC (/api/v1/auth/oidc/*) et a besoin du secret
  #     pour l'échange de code ;
  #   - api sert l'admin (/api/v1/admin/identity-providers) qui vérifie que le
  #     secret est bien monté avant d'autoriser l'activation d'un provider.
  # Créer sur host1 : printf '<client-secret>' | docker secret create sso_oidc_secret -
  # Rotation : docker secret rm sso_oidc_secret && docker secret create ... puis
  #   docker service update --force vaks-pm_api vaks-pm_controlplane.
  sso_oidc_secret:
    external: true
  # Clé privée mTLS pour le forward syslog du journal d'audit (optionnelle).
  # Le certificat (public) vit dans les settings org (`audit.syslog.clientCertPem`) ;
  # cette clé n'est lue que si un cert est configuré. Placeholder par défaut :
  #   printf 'none' | docker secret create syslog_client_key -
  # Activation : docker secret rm syslog_client_key && printf '<clé PEM>' | \
  #   docker secret create syslog_client_key - && docker service update --force vaks-pm_worker
  # ⚠️ Une seule clé par déploiement (pas par tenant) — limitation documentée.
  syslog_client_key:
    external: true
  # Token partagé worker ↔ API pour authentifier les endpoints internes
  # (/api/v1/internal/*, overlay-only). Le guard `InternalTokenGuard` fail-closed
  # exige sa présence. Créer une fois sur host1 :
  #   openssl rand -hex 32 | docker secret create worker_api_token -
  worker_api_token:
    external: true
  # Garage : secret RPC partagé entre nœuds (32 bytes hex). Créer sur host1 :
  #   openssl rand -hex 32 | docker secret create garage_rpc_secret -
  garage_rpc_secret:
    external: true
  # Garage : token admin pour l'API admin/metrics. Créer sur host1 :
  #   openssl rand -hex 32 | docker secret create garage_admin_token -
  garage_admin_token:
    external: true
  # Clé secrète S3 (générée par `garage key new`). Créer sur host1 après init :
  #   printf '<secret>' | docker secret create s3_secret_key -
  s3_secret_key:
    external: true

configs:
  # Bumper le suffixe v2/v3/… à chaque modification de traefik-dynamic.yml
  # (les configs Swarm sont immutables, seul un nom différent force le redéploiement).
  traefik_dynamic_v11:
    file: ./infra/traefik-dynamic.yml
  # Idem pour garage.toml : bumper le suffixe à chaque modif de la config.
  garage_config_v1:
    file: ./infra/garage.toml
  # Cert wildcard *.vaks-pm.com (self-signed) — monté dans Traefik. Bumper le
  # suffixe à chaque régénération du cert. La clé est montée en mode 0400.
  tls_cert_v1:
    file: ./infra/certs/wildcard.crt
  tls_key_v1:
    file: ./infra/certs/wildcard.key

services:
  traefik:
    image: traefik:v3.6.24
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # MCP en DMZ (infra/dmz/) : déclarer l'IP de la box DMZ comme proxy de
      # confiance, sinon l'API voit SON IP pour tous les internautes (throttling
      # anti-brute-force de /auth/login mutualisé). Sans DMZ : laisser commenté
      # (Traefik écrase alors tout X-Forwarded-For entrant non fiable).
      # - --entrypoints.websecure.forwardedHeaders.trustedIPs=<IP_BOX_DMZ>/32
      # Redirige tout le HTTP (:80) vers HTTPS (:443) — les routers servent en TLS.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Logs en JSON vers stdout (lisibles via `docker service logs vaks-pm_traefik`).
      # Access log = une ligne par requête HTTP (IP, host, path, status, durée).
      # Les en-têtes sont DROPPÉS par défaut pour ne jamais journaliser Authorization
      # / cookies de session ; on ré-autorise seulement quelques en-têtes inoffensifs.
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.X-Forwarded-For=keep
    configs:
      - source: traefik_dynamic_v11
        target: /etc/traefik/dynamic.yml
      - source: tls_cert_v1
        target: /certs/wildcard.crt
      - source: tls_key_v1
        target: /certs/wildcard.key
        mode: 0400
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    # `mcp-api` : Traefik route /mcp vers le service mcp (isolé, cf. networks).
    networks: [vakspm, mcp-api]
    deploy:
      placement:
        constraints: [node.role == manager]

  web:
    image: ${VAKS_IMAGE_PREFIX:-ghcr.io/vaks-fr/vakspm}-web:${VAKS_TAG:-latest}
    networks: [vakspm]
    deploy:
      replicas: 2
      # Limites dimensionnées pour des hôtes ~2 Go RAM (le tier DB Patroni/etcd/
      # HAProxy tourne nativement sur les mêmes hôtes). Limites seules, PAS de
      # reservations : sur un cluster serré, une reservation trop haute rendrait
      # la tâche non-planifiable au redéploiement. Redis/Garage laissés sans
      # limite (un OOM-kill y coûterait des données). Node : heap cap (NODE_OPTIONS)
      # sous la limite conteneur pour que V8 GC avant le OOM-killer cgroup.
      resources:
        limits: { cpus: "0.5", memory: 96M }
      update_config: { parallelism: 1, order: start-first }
      labels:
        - traefik.enable=true
        - traefik.http.routers.web.rule=PathPrefix(`/`)
        - traefik.http.routers.web.entrypoints=web,websecure
        - traefik.http.services.web.loadbalancer.server.port=80

  api:
    image: ${VAKS_IMAGE_PREFIX:-ghcr.io/vaks-fr/vakspm}-api:${VAKS_TAG:-latest}
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      # Heap V8 plafonné sous la limite conteneur (640M) — laisse ~190M off-heap
      # (buffers PDF/XLSX, prisma) avant le OOM-killer.
      NODE_OPTIONS: "--max-old-space-size=448"
      # Cellule data-only : login coupé (404, émis par le control-plane) et
      # enforcement de la frontière de confiance (JWT.tenant == Host résolu).
      SERVICE_ROLE: data-plane
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      S3_ENDPOINT: garage
      S3_PORT: "3900"
      # ID de clé d'accès Garage (login, PAS un secret — le secret vit dans le
      # Swarm secret `s3_secret_key`). Substituable via env, défaut = valeur actuelle.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GKc93ae5b3a492f39f7c1b778d}
      S3_REGION: garage
      # Isolation S3 par tenant : chaque clé d'objet est préfixée par le slug du
      # tenant (`<slug>/<clé>`). Read-fallback ON tant que S3_TENANT_PREFIX_STRICT
      # n'est pas posé (les blobs legacy migrés restent lisibles). Cf.
      # infra/ops-s3-tenant-migrate.js + .claude/plans/s3-tenant-isolation.md.
      S3_TENANT_PREFIX: "true"
      # URL absolue de l'app pour générer les liens dans les emails (CTA "Open task").
      APP_URL: http://localhost
      # Multi-tenant SaaS : N tenants par instance, base par tenant résolue
      # depuis le sous-domaine du Host (<slug>.vaks-pm.com -> base `<db>_<slug>`).
      DEPLOYMENT_MODE: pooled
      TENANCY_BASE_DOMAIN: vaks-pm.com
      # Domaine(s) public(s) d'un serveur MCP en DMZ, servant `<slug>.<domaine>`.
      # UNE valeur couvre TOUS les tenants : l'API résout le slug sur le premier
      # label. À poser seulement si le domaine public du MCP diffère du domaine
      # interne (app sur `vaks.local`, MCP sur `<slug>.mcp.exemple.fr`). Vide
      # sinon — un MCP interne sur le même domaine ne nécessite rien.
      # TENANCY_MCP_DOMAINS: "mcp.exemple.fr"
      #
      # (TENANCY_CUSTOM_DOMAINS reste disponible pour un tenant sur un domaine
      #  propre, hors `<slug>.<baseDomain>` — sans rapport avec le MCP.)
      #
      # Feed de prix des modèles (Lot 2 AGENT_COST_UNITS) — source du catalogue de
      # coûts. Défaut = JSON communautaire LiteLLM. Opt-in par org (setting
      # `agents.pricing.feedEnabled`), donc AUCUN appel sortant tant qu'aucune org
      # ne l'a activé. Décommenter pour pointer un feed Vaks hébergé plus tard.
      # MODEL_PRICING_FEED_URL: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
    secrets:
      - jwt_access_secret
      - jwt_refresh_secret
      - database_url
      - s3_secret_key
      - mfa_encryption_key
      - worker_api_token
      - redis_password
      - sso_oidc_secret
    # Lit les secrets montés en fichiers (/run/secrets/...) via un entrypoint.
    # Phase 1-2 : `prisma db push` synchronise le schéma sans historique
    # de migrations (suffisant tant que le schéma évolue rapidement).
    # À remplacer par `prisma migrate deploy` quand on commencera à versionner
    # des migrations explicites (phase 3+).
    command: >
      sh -c "export JWT_ACCESS_SECRET=$$(cat /run/secrets/jwt_access_secret) &&
             export JWT_REFRESH_SECRET=$$(cat /run/secrets/jwt_refresh_secret) &&
             export DATABASE_URL=$$(cat /run/secrets/database_url) &&
             export MFA_ENCRYPTION_KEY=$$(cat /run/secrets/mfa_encryption_key) &&
             export WORKER_API_TOKEN=$$(cat /run/secrets/worker_api_token) &&
             export SSO_OIDC_CLIENT_SECRET=$$(cat /run/secrets/sso_oidc_secret) &&
             npx prisma db push --accept-data-loss && node dist/main.js"
    # `mcp-api` : le serveur MCP joint l'API (http://api:3000) par ce seul réseau.
    networks: [vakspm, mcp-api]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.5", memory: 640M }
      update_config: { parallelism: 1, order: start-first }
      labels:
        - traefik.enable=true
        - traefik.http.routers.api.rule=PathPrefix(`/api`)
        - traefik.http.routers.api.entrypoints=web,websecure
        - traefik.http.services.api.loadbalancer.server.port=3000

  # Control plane mutualisé (front door auth + routage tenant). Même image que
  # `api`, mais `SERVICE_ROLE=control-plane` : seul ce service émet les tokens
  # (login/refresh/logout/MFA). Traefik route `/api/v1/auth` ici (cf.
  # traefik-dynamic.yml). Ne fait PAS `prisma db push` (l'`api`/data-plane
  # possède le schéma — évite une race sur la base partagée).
  controlplane:
    image: ${VAKS_IMAGE_PREFIX:-ghcr.io/vaks-fr/vakspm}-api:${VAKS_TAG:-latest}
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      NODE_OPTIONS: "--max-old-space-size=320"
      SERVICE_ROLE: control-plane
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      S3_ENDPOINT: garage
      S3_PORT: "3900"
      # ID de clé d'accès Garage (login, PAS un secret — le secret vit dans le
      # Swarm secret `s3_secret_key`). Substituable via env, défaut = valeur actuelle.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GKc93ae5b3a492f39f7c1b778d}
      S3_REGION: garage
      # Cohérence avec `api` (le control-plane ne sert pas de route S3, mais on
      # garde le flag identique en cas d'évolution du routage).
      S3_TENANT_PREFIX: "true"
      APP_URL: http://localhost
      DEPLOYMENT_MODE: pooled
      TENANCY_BASE_DOMAIN: vaks-pm.com
      # Domaine(s) public(s) d'un serveur MCP en DMZ, servant `<slug>.<domaine>`.
      # UNE valeur couvre TOUS les tenants : l'API résout le slug sur le premier
      # label. À poser seulement si le domaine public du MCP diffère du domaine
      # interne (app sur `vaks.local`, MCP sur `<slug>.mcp.exemple.fr`). Vide
      # sinon — un MCP interne sur le même domaine ne nécessite rien.
      # TENANCY_MCP_DOMAINS: "mcp.exemple.fr"
      #
      # (TENANCY_CUSTOM_DOMAINS reste disponible pour un tenant sur un domaine
      #  propre, hors `<slug>.<baseDomain>` — sans rapport avec le MCP.)
      #
      # Feed de prix des modèles (Lot 2 AGENT_COST_UNITS) — source du catalogue de
      # coûts. Défaut = JSON communautaire LiteLLM. Opt-in par org (setting
      # `agents.pricing.feedEnabled`), donc AUCUN appel sortant tant qu'aucune org
      # ne l'a activé. Décommenter pour pointer un feed Vaks hébergé plus tard.
      # MODEL_PRICING_FEED_URL: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
    secrets:
      - jwt_access_secret
      - jwt_refresh_secret
      - database_url
      - s3_secret_key
      - mfa_encryption_key
      - worker_api_token
      - redis_password
      - sso_oidc_secret
    command: >
      sh -c "export JWT_ACCESS_SECRET=$$(cat /run/secrets/jwt_access_secret) &&
             export JWT_REFRESH_SECRET=$$(cat /run/secrets/jwt_refresh_secret) &&
             export DATABASE_URL=$$(cat /run/secrets/database_url) &&
             export MFA_ENCRYPTION_KEY=$$(cat /run/secrets/mfa_encryption_key) &&
             export WORKER_API_TOKEN=$$(cat /run/secrets/worker_api_token) &&
             export SSO_OIDC_CLIENT_SECRET=$$(cat /run/secrets/sso_oidc_secret) &&
             node dist/main.js"
    networks: [vakspm]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1", memory: 448M }
      update_config: { parallelism: 1, order: start-first }

  # Serveur MCP (connecteur IA : Claude, Copilot Studio, ChatGPT). Transport
  # Streamable-HTTP **stateless** : chaque POST /mcp construit un serveur jetable,
  # aucun état n'est partagé entre requêtes ni entre réplicas. C'est ce qui rend
  # le multi-réplica sûr par construction — et pourquoi ce service ne monte
  # AUCUN secret : il ne détient rien, relaie le bearer et laisse l'API valider
  # le jeton et appliquer le RBAC (cf. mcp/src/main.ts).
  mcp:
    image: ${VAKS_IMAGE_PREFIX:-ghcr.io/vaks-fr/vakspm}-mcp:${VAKS_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "8080"
      VAKS_API_URL: http://api:3000
      VAKS_API_PREFIX: api/v1
      # Heap cap sous la limite conteneur : le serveur reconstruit ~95 tools
      # validés par zod à CHAQUE requête (buildServer), ce n'est pas gratuit.
      NODE_OPTIONS: "--max-old-space-size=112"
      # ⚠ VAKS_TENANT_HOST et VAKS_AUTH_SERVER_MODE sont volontairement ABSENTS.
      # Les deux ressemblent à des oublis, n'en ajoutez pas :
      #  - sans VAKS_TENANT_HOST, le tenant est dérivé du Host entrant, ce qui
      #    permet à un seul déploiement de servir N tenants (mode pooled). Le
      #    définir épinglerait toutes les requêtes sur un seul tenant.
      #  - sans VAKS_AUTH_SERVER_MODE, le mode est `self`. En co-localisé (MCP
      #    derrière le même Traefik que l'API), `self` et `tenant` résolvent le
      #    même host : le changer serait du risque pour zéro bénéfice.
    healthcheck:
      # Premier healthcheck du stack, et il porte un vrai rôle : avec
      # `order: start-first` et SANS healthcheck, une tâche est réputée prête dès
      # que le process démarre — le VIP Swarm y envoie donc du trafic avant que
      # Express n'ait appelé listen(), soit un 502 à chaque rolling update.
      # Timings calqués sur deploy/helm/vaks-pm/templates/api.yaml.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    # Laisse au drain SIGTERM le temps de finir les requêtes en vol. Doit rester
    # > DRAIN_MS (25 s), lui-même > VAKS_API_TIMEOUT_MS (20 s) : un appel de tool
    # légitime peut occuper 20 s, une grâce plus courte couperait exactement les
    # appels lents qu'on cherche à protéger.
    stop_grace_period: 30s
    # Isolé : ni Redis, ni Garage, ni worker (cf. déclaration `mcp-api`).
    # ⛔ Ne JAMAIS publier le port 8080 : le MCP fait confiance à UN proxy
    # (`trust proxy 1`) — joint en direct, un client forgerait son IP via
    # X-Forwarded-For (throttling par IP contourné, IP d'audit falsifiée).
    networks: [mcp-api]
    # Durcissement (pièce exposée à Internet ; image déjà non-root `USER node`).
    read_only: true
    cap_drop: [ALL]
    volumes:
      - type: tmpfs
        target: /tmp
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.5", memory: 160M }
      update_config: { parallelism: 1, order: start-first }
      placement:
        preferences: [{ spread: node.id }]

  worker:
    image: ${VAKS_IMAGE_PREFIX:-ghcr.io/vaks-fr/vakspm}-worker:${VAKS_TAG:-latest}
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # URL interne de l'API (overlay Swarm) pour lire la conf SMTP et reporter
      # le statut des envois. JAMAIS routé via Traefik.
      INTERNAL_API_URL: http://api:3000
      NODE_OPTIONS: "--max-old-space-size=224"
    secrets:
      - smtp_password
      - worker_api_token
      - redis_password
      # mTLS syslog : lu paresseusement par le processor (placeholder 'none' = absent).
      - syslog_client_key
    # Exporte SMTP_PASSWORD (utilisé quand `smtp.authMode = password`).
    # En mode anonymous le secret est ignoré, donc pas de risque à l'avoir monté.
    # WORKER_API_TOKEN authentifie les appels internes worker→API (X-Worker-Token).
    command: >
      sh -c "export SMTP_PASSWORD=$$(cat /run/secrets/smtp_password) &&
             export WORKER_API_TOKEN=$$(cat /run/secrets/worker_api_token) &&
             node dist/main.js"
    networks: [vakspm]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1", memory: 320M }

  redis:
    image: redis:7-alpine
    # `requirepass` depuis le secret : sans lui, tout conteneur de l'overlay lisait
    # et écrivait Redis (dont `oauth:refresh:*` → forge d'un PAT). `exec` +
    # docker-entrypoint.sh : Redis reste PID 1 (arrêt propre, RDB sauvé) et tourne
    # sous l'utilisateur `redis`.
    secrets:
      - redis_password
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""]
    volumes:
      - redisdata:/data
    networks: [vakspm]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  # Garage : stockage S3-compatible (remplacement de MinIO, CE EOL).
  # Single-node sur le manager. Étape ultérieure — scale à 3 nœuds (un par
  # host, replication_factor = 3) : bumper le `replication_factor` dans
  # `infra/garage.toml`, ajouter 2 réplicas avec affinité par node, refaire
  # `garage layout assign` sur les 3 nœuds.
  garage:
    image: dxflrs/garage:v1.0.1
    configs:
      - source: garage_config_v1
        target: /etc/garage.toml
    secrets:
      # Garage refuse les secrets world-readable (le défaut Swarm est 0444).
      # On force le mode propriétaire-only.
      - source: garage_rpc_secret
        target: garage_rpc_secret
        mode: 0400
      - source: garage_admin_token
        target: garage_admin_token
        mode: 0400
    volumes:
      - garagedata:/var/lib/garage
    networks: [vakspm]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
