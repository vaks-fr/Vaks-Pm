# HAProxy devant le cluster Patroni.
# - 5000 : écritures -> primary courant (détecté via l'API REST Patroni /master)
# - 5001 : lectures   -> réplicas (/replica)
# Le backend de l'app pointe sur le port 5000 (DATABASE_URL).
global
    maxconn 500
    log /dev/log local0

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen postgres_write
    bind *:5000
    option httpchk OPTIONS /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
__PG_SERVERS__

listen postgres_read
    bind *:5001
    option httpchk OPTIONS /replica
    http-check expect status 200
    balance roundrobin
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
__PG_SERVERS__
